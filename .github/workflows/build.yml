name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: unit-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux Tk and Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Unit tests
        if: runner.os != 'Linux'
        env:
          GOO_BRIDGE_HOME: ${{ runner.temp }}/goo-bridge-home
        run: python -m unittest discover -s tests -v
      - name: Unit tests with Xvfb
        if: runner.os == 'Linux'
        env:
          GOO_BRIDGE_HOME: ${{ runner.temp }}/goo-bridge-home
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Build wheel
        run: python -m pip wheel --no-deps -w dist .
      - name: Smoke-test built wheel
        shell: bash
        env:
          GOO_BRIDGE_HOME: ${{ runner.temp }}/goo-bridge-home
        run: |
          python -m pip uninstall -y goo-bridge
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          goo-bridge --version
          goo-bridge compat -o compat.html --json > compat.json
          python -c "import json; p=json.load(open('compat.json')); assert p['total'] == 39, p; assert p['matrix']['counts'] == {'L2': 13, 'L1': 15, 'L0': 11}, p; print('wheel smoke OK')"
      - uses: actions/upload-artifact@v4
        with:
          name: goo-bridge-wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  py311:
    name: unit-python-3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux Tk and Xvfb
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Unit tests with Xvfb
        env:
          GOO_BRIDGE_HOME: ${{ runner.temp }}/goo-bridge-home
        run: xvfb-run -a python -m unittest discover -s tests -v

  blender:
    name: blender-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Install Mesa software OpenGL (Windows)
        if: runner.os == 'Windows'
        uses: ssciwr/setup-mesa-dist-win@v3
        with:
          version: "26.3.0"
          deployment-choice: "1"
      - name: Cache Blender 5.2.3
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender
          key: blender-5.2.3-${{ runner.os }}-${{ runner.arch }}
      - name: Download Blender 5.2.3
        id: blender
        env:
          GOO_DEST: ${{ runner.temp }}/blender
        run: |
          python tools/install_blender.py --dest "%GOO_DEST%" --json > "%RUNNER_TEMP%/blender.json"
          python -c "import json,os; p=json.load(open(os.environ['RUNNER_TEMP']+'/blender.json')); open(os.environ['GITHUB_ENV'],'a').write('GOO_BRIDGE_BLENDER='+p['path']+'\n'); print(p)"
        shell: cmd
        if: runner.os == 'Windows' && steps.blender-cache.outputs.cache-hit != 'true'
      - name: Download Blender 5.2.3
        env:
          GOO_DEST: ${{ runner.temp }}/blender
        run: |
          python tools/install_blender.py --dest "$GOO_DEST" --json > "$RUNNER_TEMP/blender.json"
          python -c "import json,os; p=json.load(open(os.environ['RUNNER_TEMP']+'/blender.json')); open(os.environ['GITHUB_ENV'],'a').write('GOO_BRIDGE_BLENDER='+p['path']+'\n'); print(p)"
        shell: bash
        if: runner.os != 'Windows' && steps.blender-cache.outputs.cache-hit != 'true'
      - name: Locate cached Blender
        if: steps.blender-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          python -c "import os; from pathlib import Path; root=Path(os.environ['RUNNER_TEMP'])/'blender'; hits=[p for p in root.rglob('*') if p.is_file() and p.name in ('blender.exe','blender','Blender')]; p=sorted(hits)[0]; open(os.environ['GITHUB_ENV'],'a').write('GOO_BRIDGE_BLENDER='+str(p)+'\n'); print(p)"
      - name: Full test suite with Blender (Linux)
        if: runner.os == 'Linux'
        env:
          GOO_BRIDGE_HOME: ${{ runner.temp }}/goo-bridge-home
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Full test suite with Blender (macOS/Windows)
        if: runner.os != 'Linux'
        env:
          GOO_BRIDGE_HOME: ${{ runner.temp }}/goo-bridge-home
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: python -m unittest discover -s tests -v
      - name: Doctor
        run: python -m goo_bridge doctor --json
